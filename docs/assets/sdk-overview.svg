<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 1400 840"><title>Roam data SDK workflow</title><desc>An illustrated dog trots above a schematic location trail. Roam validates and summarizes supplied location data. The synthetic walk example has two points, an estimated distance of 1.112 km, and a ten-minute segment span.</desc>
