<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 1400 840"><title>Roam data SDK workflow</title><desc>Supplied JSON is validated and summarized locally. The synthetic example has two points, an estimated distance of 1.112 km, and a ten-minute segment span.</desc>
<defs></defs>
<rect width="1400" height="840" fill="#1c2b43"/>
<g font-family="Avenir Next, Futura, DejaVu Sans, sans-serif" font-weight="500" fill="#f2ecdc">
  <text x="80" y="117" font-size="27">Offline tools for</text>
  <text x="80" y="153" font-size="27">pet location data</text>
  <g font-size="22" fill="#c6c9c6">
    <text x="80" y="244">Validate</text><text x="210" y="244">Measure</text><text x="350" y="244">Summarize</text>
  </g>
  <text x="76" y="632" font-size="119" font-weight="500" letter-spacing="-5">Roam</text>
  <text x="80" y="709" font-size="61" font-weight="500" letter-spacing="-2">data SDK</text>
  <text x="80" y="784" font-size="18" fill="#c6c9c6">TypeScript / Node.js</text>
</g>
<text x="80" y="285" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#c6c9c6">summarizeDataset(data)</text>
<g font-family="Avenir Next, DejaVu Sans, sans-serif" font-weight="500" font-size="18" fill="#c6c9c6">
