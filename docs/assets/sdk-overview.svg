<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 1400 840"><title>Roam data SDK workflow</title><desc>An illustrated dog runs above a schematic location trail. Roam validates and summarizes supplied location data. The synthetic walk example has two points, an estimated distance of 1.112 km, and a ten-minute segment span.</desc>
<rect width="1400" height="840" fill="#1c2b43"/>
<g font-family="Avenir Next, Futura, DejaVu Sans, sans-serif" font-weight="500" fill="#f2ecdc">
  <text x="80" y="96" font-size="17" fill="#c6c9c6">TypeScript / Node.js</text>
  <text x="76" y="207" font-size="110" letter-spacing="-4.5">Roam</text>
  <text x="80" y="280" font-size="58" letter-spacing="-2">data SDK</text>
  <text x="80" y="350" font-size="25">Offline tools for</text>
  <text x="80" y="384" font-size="25">dog location data</text>
  <text x="80" y="456" font-size="20" fill="#c6c9c6">Validate · Measure · Summarize</text>
</g>
<text x="80" y="500" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#c6c9c6">summarizeDataset(data)</text>
